name: Rust

# The app's Rust unit tests, with S3 sync run against real MinIO and RustFS servers.
on:
  pull_request:
    paths:
      - ".github/workflows/rust.yml"
      - "src-tauri/**"
  push:
    branches: [main, develop]
    paths:
      - ".github/workflows/rust.yml"
      - "src-tauri/**"
  workflow_dispatch:

concurrency:
  group: rust-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: cargo test (${{ matrix.storage }})
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - storage: minio
            run: docker run -d -p 9000:9000 -e MINIO_ROOT_USER=bennovel -e MINIO_ROOT_PASSWORD=bennovel-secret minio/minio server /data
          - storage: rustfs
            run: docker run -d -p 9000:9000 -e RUSTFS_ACCESS_KEY=bennovel -e RUSTFS_SECRET_KEY=bennovel-secret rustfs/rustfs:latest
    env:
      S3_TEST_ENDPOINT: http://127.0.0.1:9000
      S3_TEST_ACCESS_KEY: bennovel
      S3_TEST_SECRET_KEY: bennovel-secret
    steps:
      - uses: actions/checkout@v4

      - name: Start ${{ matrix.storage }}
        run: |
          ${{ matrix.run }}
          for i in $(seq 1 60); do curl -s -o /dev/null http://127.0.0.1:9000 && exit 0; sleep 1; done
          docker ps -a; docker logs $(docker ps -aq | head -1); exit 1

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - run: cargo test --lib
        working-directory: src-tauri
