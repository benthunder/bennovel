# Gradle settings for the build server. This file (in GRADLE_USER_HOME) wins over
# the gradle.properties that `tauri android init` generates.
# No daemon: a runner would keep it alive, holding RAM, between builds.
org.gradle.daemon=false
org.gradle.jvmargs=-Xmx1536m -XX:MaxMetaspaceSize=512m -Dfile.encoding=UTF-8
org.gradle.workers.max=2
org.gradle.parallel=false
kotlin.daemon.jvmargs=-Xmx768m
kotlin.compiler.execution.strategy=in-process
