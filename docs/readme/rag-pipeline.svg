<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 460" width="1200" height="460" role="img" aria-labelledby="t2 d2">
  <title id="t2">How AI Translate learns as it goes</title>
  <desc id="d2">A pipeline: detect, recall from the book's wiki, translate or rewrite, save, then learn new wiki entries, which feed back into recall for the next chapter</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 Z" fill="#8c491a"/>
    </marker>
    <marker id="arrow2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 Z" fill="#56633f"/>
    </marker>
  </defs>

  <rect width="1200" height="460" rx="28" fill="#f9f4ed"/>
  <rect x="1" y="1" width="1198" height="458" rx="27" fill="none" stroke="#e1d4ba" stroke-width="2"/>

  <text x="40" y="52" font-family="Georgia, 'Noto Serif', serif" font-size="26" font-weight="700" fill="#201e1d">AI Translate — a small RAG loop, per book</text>
  <text x="40" y="80" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#56633f">src-tauri/src/library/translate.rs · a LangGraph graph (rust-langgraph)</text>

  <!-- pipeline nodes -->
  <g font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#201e1d">
    <!-- detect -->
    <rect x="40" y="130" width="150" height="64" rx="16" fill="#ffffff" stroke="#c67139" stroke-width="2"/>
    <text x="115" y="156" text-anchor="middle">detect</text>
    <text x="115" y="176" text-anchor="middle" font-size="11.5" font-weight="400" fill="#56633f">language &amp; mode</text>

    <!-- recall -->
    <rect x="230" y="130" width="150" height="64" rx="16" fill="#ffffff" stroke="#c67139" stroke-width="2"/>
    <text x="305" y="156" text-anchor="middle">recall</text>
    <text x="305" y="176" text-anchor="middle" font-size="11.5" font-weight="400" fill="#56633f">reads the wiki</text>

    <!-- translate/rewrite -->
    <rect x="420" y="130" width="190" height="64" rx="16" fill="#ffffff" stroke="#c67139" stroke-width="2"/>
    <text x="515" y="150" text-anchor="middle">translate</text>
    <text x="515" y="170" text-anchor="middle">/ rewrite</text>

    <!-- save -->
    <rect x="650" y="130" width="130" height="64" rx="16" fill="#ffffff" stroke="#c67139" stroke-width="2"/>
    <text x="715" y="156" text-anchor="middle">save</text>
    <text x="715" y="176" text-anchor="middle" font-size="11.5" font-weight="400" fill="#56633f">chapter text</text>

    <!-- learn -->
    <rect x="820" y="130" width="150" height="64" rx="16" fill="#ffffff" stroke="#56633f" stroke-width="2.3"/>
    <text x="895" y="156" text-anchor="middle">learn</text>
    <text x="895" y="176" text-anchor="middle" font-size="11.5" font-weight="400" fill="#56633f">writes the wiki</text>
  </g>

  <!-- arrows between pipeline nodes -->
  <g stroke="#8c491a" stroke-width="2.2" fill="none" marker-end="url(#arrow)">
    <path d="M190 162 L228 162"/>
    <path d="M380 162 L418 162"/>
    <path d="M610 162 L648 162"/>
    <path d="M780 162 L818 162"/>
  </g>

  <!-- wiki store -->
  <g font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" fill="#201e1d">
    <rect x="330" y="300" width="420" height="104" rx="20" fill="#fff2eb" stroke="#c67139" stroke-width="2"/>
    <text x="540" y="332" text-anchor="middle" font-size="17" font-weight="700">Book wiki</text>
    <text x="540" y="356" text-anchor="middle" font-size="12.5" fill="#56633f">characters · places · factions · terms · relations</text>
    <text x="540" y="376" text-anchor="middle" font-size="12.5" fill="#56633f">plain SQLite — found by name (Aho-Corasick)</text>
    <text x="540" y="394" text-anchor="middle" font-size="11.5" fill="#8c6b4f">on this device only</text>
  </g>

  <!-- recall reads from wiki -->
  <path d="M305 194 C 305 240, 400 260, 400 298" stroke="#c67139" stroke-width="2.2" fill="none" marker-end="url(#arrow)"/>
  <text x="300" y="250" font-size="12" fill="#8c491a" font-weight="700">reads ▸ context for the prompt</text>

  <!-- learn writes to wiki -->
  <path d="M895 194 C 895 250, 760 270, 752 298" stroke="#56633f" stroke-width="2.2" fill="none" marker-end="url(#arrow2)"/>
  <text x="770" y="250" font-size="12" fill="#56633f" font-weight="700">▾ writes new entries</text>

  <text x="40" y="440" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#56633f">Each chapter recalls names and relations the book has taught so far, then teaches the wiki a little more — translations stay consistent without a glossary written by hand.</text>
</svg>
