<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="_ds/organic-dc15eeaf-7bc1-44df-95c7-dd2952f5d882/styles.css">
<script src="_ds/organic-dc15eeaf-7bc1-44df-95c7-dd2952f5d882/_ds_bundle.js"></script>
</helmet>
<div style="width:100%;height:100%;border-radius:16px;background:{{ bg }};color:{{ fg }};position:relative;overflow:hidden;padding:10px;display:flex;flex-direction:column;justify-content:flex-end;box-shadow:var(--shadow-sm)">
<div style="position:absolute;width:78%;aspect-ratio:1;border-radius:50%;background:{{ deco }};top:-16%;right:-22%;opacity:0.7"></div>
<div style="position:relative;font-family:var(--font-heading);font-size:{{ fs }}px;line-height:1.05;text-wrap:balance">{{ title }}</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:120,&quot;height&quot;:172},&quot;title&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Ashvale Chronicles&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;bg&quot;:{&quot;editor&quot;:null,&quot;default&quot;:&quot;var(--color-accent-300)&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;fg&quot;:{&quot;editor&quot;:null,&quot;default&quot;:&quot;var(--color-accent-900)&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;deco&quot;:{&quot;editor&quot;:null,&quot;default&quot;:&quot;var(--color-accent-500)&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;fs&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:16,&quot;tsType&quot;:&quot;number&quot;}}"></script>
</body>
</html>
