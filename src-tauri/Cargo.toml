[package]
name = "bennovel"
version = "0.5.0"
description = "BenNovel — novel reader"
edition = "2021"

[lib]
# The `_lib` suffix avoids a name clash with the binary on Windows.
name = "bennovel_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
epub = "2.1.5"
tauri-plugin-dialog = "2.8.1"
tauri-plugin-fs = "2.6.0"
pdfium-render = { version = "0.9.4", default-features = false, features = ["thread_safe", "pdfium_latest"] }
image = { version = "0.25", default-features = false, features = ["jpeg"] }
thiserror = "2.0.21"
encoding_rs = "0.8.42"
quick-xml = { version = "0.42.0", features = ["encoding"] }
zip = { version = "3", default-features = false, features = ["deflate"] }
libchm = "0.3.0"
djvu-rs = { version = "0.41.0", features = ["mmap"] }
rusqlite = { version = "0.40.2", features = ["bundled"] }
tauri-plugin-folder-picker = { path = "plugins/folder-picker" }
