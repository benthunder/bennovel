[package]
name = "bennovel"
version = "0.20.0"
description = "BenNovel — novel reader"
edition = "2021"

[lib]
# The `_lib` suffix avoids a name clash with the binary on Windows.
name = "bennovel_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
epub = "2.1.5"
tauri-plugin-dialog = "2.8.1"
tauri-plugin-fs = "2.6.0"
pdfium-render = { version = "0.9.4", default-features = false, features = ["thread_safe", "pdfium_latest"] }
image = { version = "0.25", default-features = false, features = ["jpeg"] }
thiserror = "2.0.21"
encoding_rs = "0.8.42"
chardetng = "0.1.17"
quick-xml = { version = "0.42.0", features = ["encoding"] }
zip = { version = "3", default-features = false, features = ["deflate"] }
libchm = "0.3.0"
djvu-rs = { version = "0.41.0", features = ["mmap"] }
rusqlite = { version = "0.40.2", features = ["bundled"] }
flate2 = "1"
tauri-plugin-folder-picker = { path = "plugins/folder-picker" }
tauri-plugin-opener = "2"
ureq = { version = "2", default-features = false, features = ["tls"] }
tokio = { version = "1", features = ["sync", "rt"] }
rust-langgraph = { version = "0.1.1", default-features = false }
tauri-plugin-notification = "2"
aho-corasick = "1"

# Sends a second launch (a file to open) to the running app.
[target.'cfg(any(target_os = "macos", windows, target_os = "linux"))'.dependencies]
tauri-plugin-single-instance = "2"

# Calls into the Android WebView (focus it so the first tap opens the keyboard).
[target.'cfg(target_os = "android")'.dependencies]
jni = "0.21"
