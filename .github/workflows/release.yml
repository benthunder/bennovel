name: Build & Release

# Push a tag like `v0.1.0`, or run this workflow manually with a version, to build
# Linux + Android and publish a GitHub Release.
# Pull requests that touch the app or this workflow build everything (no release)
# so problems show up before tagging.
on:
  push:
    tags: ["v*"]
  pull_request:
    paths:
      - ".github/workflows/release.yml"
      - "src-tauri/**"
      - "package.json"
      - "package-lock.json"
  workflow_dispatch:
    inputs:
      version:
        description: "Release tag to create, e.g. v0.1.0 (leave empty to only build)"
        required: false

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

# Pdfium (PDF text) is loaded by the app at runtime; these builds ship it alongside.
env:
  PDFIUM_URL: https://github.com/bblanchon/pdfium-binaries/releases/download/chromium%2F8086

jobs:
  linux:
    name: Linux (AppImage + deb)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - run: npm ci

      - name: Download Pdfium
        run: |
          mkdir -p src-tauri/pdfium
          curl -fsSL "$PDFIUM_URL/pdfium-linux-x64.tgz" | tar xz -C src-tauri/pdfium lib/libpdfium.so
          mv src-tauri/pdfium/lib/libpdfium.so src-tauri/pdfium/

      - name: Build
        run: >
          npx tauri build --bundles appimage,deb
          --config '{"bundle":{"resources":{"pdfium/libpdfium.so":"pdfium/libpdfium.so"}}}'

      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: |
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/deb/*.deb
          if-no-files-found: error

  android:
    name: Android (APK)
    runs-on: ubuntu-latest
    env:
      NDK_VERSION: 27.0.12077973
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # The runner image ships the Android SDK; just add the NDK.
      - name: Install NDK
        run: |
          SDKMANAGER="$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | sort -V | tail -1)"
          (yes || true) | "$SDKMANAGER" --install "ndk;${NDK_VERSION}" > /dev/null
          echo "NDK_HOME=$ANDROID_HOME/ndk/${NDK_VERSION}" >> "$GITHUB_ENV"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - run: npm ci

      - name: Generate Android project
        run: |
          npx tauri android init --ci
          cp -r src-tauri/icons/android/* src-tauri/gen/android/app/src/main/res/

      - name: Add Pdfium to the APK
        run: |
          set -euo pipefail
          for pair in arm64:arm64-v8a arm:armeabi-v7a x64:x86_64; do
            arch="${pair%%:*}"; abi="${pair##*:}"
            dir="src-tauri/gen/android/app/src/main/jniLibs/$abi"
            mkdir -p "$dir" tmp-pdfium
            curl -fsSL "$PDFIUM_URL/pdfium-android-$arch.tgz" | tar xz -C tmp-pdfium lib/libpdfium.so
            mv tmp-pdfium/lib/libpdfium.so "$dir/"
          done
          rm -rf tmp-pdfium

      - name: Build APK
        run: npx tauri android build --apk --target aarch64 --target armv7 --target x86_64

      # Uses the release keystore from repo secrets when present. Without them the
      # APK is signed with a throwaway key: installable for testing, but a later
      # build signed differently cannot update it in place (uninstall first).
      - name: Sign APK
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          set -euo pipefail
          BT="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)"
          UNSIGNED="$(find src-tauri/gen/android/app/build/outputs/apk -name '*universal*release*.apk' | head -1)"
          test -n "$UNSIGNED"
          if [ -n "${KEYSTORE_B64:-}" ]; then
            echo "$KEYSTORE_B64" | base64 -d > release.keystore
          else
            echo "::warning::No ANDROID_KEYSTORE_BASE64 secret; signing APK with a temporary test key."
            KEYSTORE_PASSWORD=android
            KEY_ALIAS=bennovel
            keytool -genkeypair -keystore release.keystore -storepass "$KEYSTORE_PASSWORD" \
              -keypass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS" -keyalg RSA -keysize 2048 \
              -validity 10000 -dname "CN=BenNovel Test"
          fi
          VERSION="$(node -p "require('./src-tauri/tauri.conf.json').version")"
          mkdir -p out
          "$BT/zipalign" -p -f 4 "$UNSIGNED" aligned.apk
          "$BT/apksigner" sign --ks release.keystore --ks-pass "pass:$KEYSTORE_PASSWORD" \
            --ks-key-alias "$KEY_ALIAS" --key-pass "pass:$KEYSTORE_PASSWORD" \
            --out "out/BenNovel_${VERSION}_android.apk" aligned.apk
          "$BT/apksigner" verify "out/BenNovel_${VERSION}_android.apk"
          rm -f release.keystore

      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: out/*.apk
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v') || inputs.version != ''
    needs: [linux, android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      # Creates the tag on this commit when run manually. If the release already
      # exists (e.g. drafted in the GitHub UI), the files are added to it.
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.version || github.ref_name }}
        run: |
          FILES=$(find dist -type f \( -name '*.AppImage' -o -name '*.deb' -o -name '*.apk' \))
          echo "$FILES"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" --clobber $FILES
          else
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
              --title "BenNovel $TAG" --generate-notes $FILES
          fi
